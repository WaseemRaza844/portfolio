name: Build resume PDFs

on:
  push:
    branches: [main, develop]
    paths:
      - 'resume/**'
      - 'dist/data/**'
      - 'dist/render.js'
      - 'dist/styles.css'
      - 'dist/learning.html'
      - '.github/workflows/build-resumes.yml'
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - 'resume/**'
      - 'dist/data/**'
      - '.github/workflows/build-resumes.yml'

permissions:
  contents: read

concurrency:
  group: resumes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-encoding-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: resume/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r resume/requirements.txt
      - name: Run resume unit tests on Windows
        run: python -m unittest discover -s resume/tests
      - name: Verify UTF-8 extracted-text output on Windows
        shell: pwsh
        run: |
          python -c "import importlib.util, pathlib, tempfile; p=pathlib.Path('resume/latex_renderer.py'); s=importlib.util.spec_from_file_location('lr',p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); d=tempfile.TemporaryDirectory(); f=pathlib.Path(d.name)/'phone.txt'; m.write_utf8_text(f,'☎ +1 732-803-9703 | résumé'); assert f.read_text(encoding='utf-8') == '☎ +1 732-803-9703 | résumé'"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: resume/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF dependencies
        run: python -m pip install -r resume/requirements.txt
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended lmodern
      - name: Check source selection and links
        run: python -m unittest discover -s resume/tests
      - name: Generate all variants
        run: python resume/build.py --all
      - name: Generate tailored job resumes
        run: python resume/build_tailored.py --all
      - name: Store generated PDFs
        uses: actions/upload-artifact@v4
        with:
          name: Waseem-Raza-Resumes
          path: |
            resume/output/**/*.pdf
            resume/output/**/*.tex
            resume/output/build-report.json
            resume/tailored/**/output/*.pdf
            resume/tailored/**/output/build-report.json
            resume/tailored/**/*.tex
          if-no-files-found: error
          retention-days: 30
