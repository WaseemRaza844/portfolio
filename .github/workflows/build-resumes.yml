name: Build resume PDFs and application documents

on:
  push:
    branches: [main, develop]
    paths:
      - 'resume/**'
      - 'dist/data/**'
      - 'dist/render.js'
      - 'dist/styles.css'
      - 'dist/learning.html'
      - '.github/workflows/build-resumes.yml'
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - 'resume/**'
      - 'dist/data/**'
      - '.github/workflows/build-resumes.yml'

permissions:
  contents: read

concurrency:
  group: resumes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-encoding-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: resume/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r resume/requirements.txt
      - name: Run resume unit tests on Windows
        run: python -m unittest discover -s resume/tests
      - name: Verify UTF-8 extracted-text output on Windows
        shell: pwsh
        run: |
          python -c "import importlib.util, pathlib, tempfile; p=pathlib.Path('resume/latex_renderer.py'); s=importlib.util.spec_from_file_location('lr',p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); d=tempfile.TemporaryDirectory(); f=pathlib.Path(d.name)/'phone.txt'; m.write_utf8_text(f,'☎ +1 732-803-9703 | résumé'); assert f.read_text(encoding='utf-8') == '☎ +1 732-803-9703 | résumé'"

  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: resume/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF and Word dependencies
        run: python -m pip install -r resume/requirements.txt
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended lmodern
      - name: Run resume unit tests
        run: python -m unittest discover -s resume/tests
      - name: Generate reusable and faculty application CVs
        run: python resume/build.py --all
      - name: Generate standalone industry and faculty application resumes
        run: python resume/build_tailored.py --all
      - name: Generate editable faculty application Word documents
        run: python resume/build_application_documents.py
      - name: Generate Princeton Lecturer cover letter PDF
        run: python resume/job-applications/faculty/princeton-university-lecturer-ece/build_cover_letter.py
      - name: Generate Rutgers ECE Lecturer supporting PDFs
        run: python resume/job-applications/faculty/rutgers-ece-lecturer-2026/build_documents.py
      - name: Package consistently named Rutgers application documents
        run: python resume/job-applications/faculty/rutgers-ece-lecturer-2026/package_submission.py
      - name: Build Susquehanna CS tenure-track documents
        run: python resume/job-applications/faculty/susquehanna-cs-assistant-professor-2027/build_documents.py
      - name: Package Susquehanna submission-ready public documents
        run: python resume/job-applications/faculty/susquehanna-cs-assistant-professor-2027/package_submission.py
      - name: Build UCNJ Engineering Technology adjunct cover letters
        run: python resume/job-applications/faculty/ucnj-engineering-technology-adjunct-spring-2027/build_documents.py
      - name: Package UCNJ Engineering Technology adjunct documents
        run: python resume/job-applications/faculty/ucnj-engineering-technology-adjunct-spring-2027/package_submission.py
      - name: Audit generic and tailored faculty PDF layouts
        run: python resume/validate_pdf_layout.py
      - name: Validate all generated outputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          import json
          root=Path('resume')
          generic=list((root/'resume-profiles').glob('*/*.pdf'))
          applications=list((root/'job-applications').rglob('*.pdf'))
          assert len(generic) >= 10, f'Expected 10+ profile PDFs, found {len(generic)}'
          sources=list((root/'resume-profiles').glob('*/Waseem_Raza_*.tex'))
          assert len(sources) >= 10, f'Expected editable TeX for 10+ profiles, found {len(sources)}'
          assert len(applications) >= 5, f'Expected 5+ tailored application PDFs, found {len(applications)}'
          job_reports=list((root/'job-applications').rglob('build-report.json'))
          assert len(job_reports) >= 4, f'Expected reports for three industry and one standalone faculty application, found {len(job_reports)}'
          ohio=root/'job-applications/faculty/ohio-state-optimization-ml-r160519'
          ohio_report=ohio/'build-report.json'
          assert ohio_report.is_file(), 'Ohio State standalone faculty resume was not rebuilt'
          assert json.loads(ohio_report.read_text(encoding='utf-8'))['pages']==2, 'Ohio State resume must be two well-filled pages'
          app=root/'job-applications/faculty/lafayette-college-assistant-professor-ece'
          manifest=app/'application-documents.json'
          assert manifest.is_file(), 'Lafayette application document manifest is missing'
          specs=json.loads(manifest.read_text(encoding='utf-8'))['documents']
          assert len(specs)==5, f'Expected five supporting documents, found {len(specs)}'
          for spec in specs:
              source=app/spec['source']
              output=app/spec['output']
              assert source.is_file(), f'Missing editable source: {source}'
              assert output.is_file(), f'Missing Word document: {output}'
              doc=Document(output)
              text=' '.join(p.text for p in doc.paragraphs)
              assert len(text)>400, f'Word file is unexpectedly empty: {output.name}'
              if spec.get('layout')=='references':
                  assert len(doc.tables)==3, 'Expected three editable professional-reference tables'
          rutgers=root/'job-applications/faculty/rutgers-ece-lecturer-2026'
          rutgers_sources=json.loads((rutgers/'application-documents.json').read_text(encoding='utf-8'))['documents']
          assert len(rutgers_sources)==4, 'Rutgers must have four editable document sources'
          for spec in rutgers_sources:
              assert (rutgers/spec['source']).is_file(), f"Missing Rutgers source: {spec['source']}"
              assert (rutgers/spec['output']).is_file(), f"Missing Rutgers Word output: {spec['output']}"
          assert (rutgers/'Waseem_Raza_FACULTY_RUTGERS_ECE_LECTURER_2026.pdf').is_file(), 'Missing Rutgers academic CV'
          assert (rutgers/'Waseem_Raza_RUTGERS_Teaching_Philosophy.pdf').is_file(), 'Missing Rutgers teaching philosophy'
          assert (rutgers/'Waseem_Raza_RUTGERS_Courses_Taught.pdf').is_file(), 'Missing Rutgers courses-taught file'
          ready=rutgers/'submission-ready'
          expected=[
              'WRaza_FAC_RUTGERS_ECE_LECT_2026.pdf',
              'WRaza_FAC_RUTGERS_ECE_LECT_2026_Teaching_Philosophy.pdf',
              'WRaza_FAC_RUTGERS_ECE_LECT_2026_Courses_Taught.pdf',
              'WRaza_FAC_RUTGERS_ECE_LECT_2026_Cover_Letter.pdf',
              'WRaza_FAC_RUTGERS_ECE_LECT_2026_Cover_Letter.docx',
          ]
          for filename in expected:
              assert (ready/filename).is_file(), f'Missing named Rutgers output: {filename}'
          su=root/'job-applications/faculty/susquehanna-cs-assistant-professor-2027'
          su_manifest=json.loads((su/'application-documents.json').read_text(encoding='utf-8'))['documents']
          assert len(su_manifest)==4, 'Expected three statements plus redacted reference roster Word sources'
          for doc in su_manifest:
              assert (su/doc['source']).is_file(), f'Missing Susquehanna source {doc["source"]}'
              assert (su/doc['output']).is_file(), f'Missing Susquehanna Word output {doc["output"]}'
          assert (su/'Waseem_Raza_FACULTY_SUSQUEHANNA_CS_ASSISTANT_PROFESSOR_2027.pdf').is_file(), 'Missing Susquehanna CV'
          for title in ['CV','Cover_Letter','Teaching_Philosophy','Research_Plan']:
              filename=f'WRaza_FAC_SUSQUEHANNA_CS_2027_{title}.pdf'
              assert (su/'submission-ready'/filename).is_file(), f'Missing final Susquehanna PDF: {filename}'
          from pypdf import PdfReader
          cover=su/'submission-ready/WRaza_FAC_SUSQUEHANNA_CS_2027_Cover_Letter.pdf'
          assert len(PdfReader(str(cover)).pages)<=2, 'Susquehanna letter is too long'
          ucnj=root/'job-applications/faculty/ucnj-engineering-technology-adjunct-spring-2027'
          ucnj_docs=json.loads((ucnj/'application-documents.json').read_text(encoding='utf-8'))['documents']
          assert len(ucnj_docs)==2, 'UCNJ day and evening letters are both required for this application folder'
          for item in ucnj_docs:
              assert (ucnj/item['source']).is_file(), f'Missing UCNJ source: {item["source"]}'
              assert (ucnj/item['output']).is_file(), f'Missing UCNJ Word: {item["output"]}'
          ready=ucnj/'submission-ready'
          required=['WRaza_FAC_UCNJ_ET27_CV.pdf','WRaza_FAC_UCNJ_ET27_CL_Day.pdf','WRaza_FAC_UCNJ_ET27_CL_Eve.pdf']
          assert all((ready/name).is_file() for name in required), 'Missing short-name UCNJ files'
          assert len(PdfReader(str(ready/required[0])).pages)==3, 'UCNJ shared CV must have 3 pages'
          for name in required[1:]:
              assert len(PdfReader(str(ready/name)).pages)==1, f'UCNJ {name} should be one page'
          assert not list(ready.glob('WRaza_ADJ_UCNJ_ENGTECH_SPR27_*')), 'Old long-name copies remain'
          tex=(ucnj/'Waseem_Raza_FACULTY_UCNJ_ENGINEERING_TECHNOLOGY_ADJUNCT_SPRING_2027.tex').read_text(encoding='utf-8')
          assert 'Technical Skills' in tex and 'Engineering Tools' in tex, 'UCNJ tools heading missing'
          assert 'MATLAB' in tex and 'Python' in tex and 'SQL' in tex and 'PyTorch' in tex, 'UCNJ technical inventory missing'
          assert tex.index('Technical Skills')<tex.index('Selected Applied Engineering Projects'), 'UCNJ tools are still buried after projects'
          print(f'Validated {len(generic)} generic PDFs, {len(applications)} application PDFs, Susquehanna and UCNJ letters.')

          PY

      - name: Upload generated resumes and application documents
        uses: actions/upload-artifact@v4
        with:
          name: Waseem-Raza-Resume-and-Application-Documents
          path: |
            resume/resume-profiles/**/*.pdf
            resume/resume-profiles/**/*.tex
            resume/resume-profiles/build-report.json
            resume/job-applications/**/*.pdf
            resume/job-applications/faculty/**/*.docx
            resume/job-applications/faculty/**/*.md
            resume/job-applications/industry/**/*.tex
            resume/job-applications/faculty/**/*.tex
            resume/job-applications/industry/**/metadata.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish browseable generated files to develop
        if: github.event_name == 'push' && github.ref_name == 'develop'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS= read -r -d '' file; do git add -f -- "$file"; done < <(find resume/resume-profiles resume/job-applications -type f \( -name '*.pdf' -o -name '*.tex' -o -name '*.docx' -o -name 'build-report.json' \) -print0)
          git add -u -- resume/resume-profiles resume/job-applications
          if git diff --cached --quiet; then
            echo "Generated TeX, PDFs, and Word documents are already current."
          else
            git commit -m "docs(resume): publish editable TeX and profile PDFs [skip ci]"
            git pull --rebase origin develop
            git push origin HEAD:develop
          fi
