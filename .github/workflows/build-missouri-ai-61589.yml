name: Build University of Missouri AI faculty application (61589)

on:
  push:
    branches: [develop]
    paths:
      - 'resume/job-applications/faculty/missouri-ai-geospatial-national-security-61589/Cover_Letter.md'
      - 'resume/job-applications/faculty/missouri-ai-geospatial-national-security-61589/Research_Vision.md'
      - 'resume/job-applications/faculty/missouri-ai-geospatial-national-security-61589/application-documents.json'
      - 'resume/job-applications/faculty/missouri-ai-geospatial-national-security-61589/build_documents.py'
      - 'resume/build_application_documents.py'
      - 'resume/job-applications/faculty/ece-shared-2027/build_packages.py'
      - 'resume/resume-profiles/faculty/Waseem_Raza_FACULTY_CS_AI_ML.pdf'
      - '.github/workflows/build-missouri-ai-61589.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: missouri-ai-61589-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document dependencies
        run: python -m pip install -r resume/requirements.txt
      - name: Build Missouri AI documents
        run: python resume/job-applications/faculty/missouri-ai-geospatial-national-security-61589/build_documents.py
      - name: Validate CV, cover letter, research vision and Word versions
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from pypdf import PdfReader

          base=Path('resume/job-applications/faculty/missouri-ai-geospatial-national-security-61589/submission-ready')
          cv=base/'WRaza_MU_AI61589_CV.pdf'
          common=Path('resume/resume-profiles/faculty/Waseem_Raza_FACULTY_CS_AI_ML.pdf')
          letter=base/'WRaza_MU_AI61589_Cover_Letter.pdf'
          vision=base/'WRaza_MU_AI61589_Research_Vision.pdf'
          words=[
              base/'WRaza_MU_AI61589_Cover_Letter.docx',
              base/'WRaza_MU_AI61589_Research_Vision.docx',
          ]
          assert all(p.is_file() for p in [cv,common,letter,vision,*words]), 'Incomplete Missouri package'
          assert sha256(cv.read_bytes()).digest()==sha256(common.read_bytes()).digest(), 'Shared CV must not change'
          assert len(PdfReader(str(cv)).pages)==4
          assert len(PdfReader(str(letter)).pages)==1, 'Cover letter must fit one page'
          assert 2<=len(PdfReader(str(vision)).pages)<=4, 'Research vision must fit in 2-4 pages'
          assert len(list(base.glob('*.pdf')))==3, 'Expected 3 public PDFs'
          print('Missouri Job 61589: 4-page common CV; 1-page letter; 2-4-page research vision')
          PY
      - name: Publish validated public application documents to develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            resume/job-applications/faculty/missouri-ai-geospatial-national-security-61589/submission-ready/WRaza_MU_AI61589_CV.pdf \
            resume/job-applications/faculty/missouri-ai-geospatial-national-security-61589/submission-ready/WRaza_MU_AI61589_Cover_Letter.pdf \
            resume/job-applications/faculty/missouri-ai-geospatial-national-security-61589/submission-ready/WRaza_MU_AI61589_Cover_Letter.docx \
            resume/job-applications/faculty/missouri-ai-geospatial-national-security-61589/submission-ready/WRaza_MU_AI61589_Research_Vision.pdf \
            resume/job-applications/faculty/missouri-ai-geospatial-national-security-61589/submission-ready/WRaza_MU_AI61589_Research_Vision.docx
          if ! git diff --cached --quiet; then
            git commit -m "Publish Missouri AI faculty application PDFs and Word docs"
            git reset --hard HEAD
            git pull --rebase origin develop
            git push origin HEAD:develop
          fi
