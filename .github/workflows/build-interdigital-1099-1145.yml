name: Build shared InterDigital Wireless and RAN research applications

on:
  push:
    branches: [develop]
    paths:
      - 'resume/job-applications/industry/interdigital-wireless-ran-research-req26-1099-1145/**'
      - '.github/workflows/build-interdigital-1099-1145.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: interdigital-1099-1145-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: |
          python -m pip install -r resume/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended lmodern
      - name: Build and validate shared resume and two cover letters
        run: python resume/job-applications/industry/interdigital-wireless-ran-research-req26-1099-1145/build_documents.py
      - name: Publish package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f resume/job-applications/industry/interdigital-wireless-ran-research-req26-1099-1145/submission-ready/WRaza_IDCC_*
          git add -f resume/job-applications/industry/interdigital-wireless-ran-research-req26-1099-1145/Waseem_Raza_INTERDIGITAL_WIRELESS_RAN_RESEARCH.pdf resume/job-applications/industry/interdigital-wireless-ran-research-req26-1099-1145/build-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish shared InterDigital research application documents"
            git reset --hard HEAD
            git pull --rebase origin develop
            git push origin HEAD:develop
          fi
