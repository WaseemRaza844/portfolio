name: Build Saint Peter's Data Science adjunct application documents

on:
  push:
    branches: [develop]
    paths:
      - 'resume/job-applications/faculty/saint-peters-data-science-adjunct-2026/Cover_Letter.md'
      - 'resume/job-applications/faculty/saint-peters-data-science-adjunct-2026/application-documents.json'
      - 'resume/job-applications/faculty/saint-peters-data-science-adjunct-2026/build_documents.py'
      - 'resume/build_application_documents.py'
      - 'resume/job-applications/faculty/ece-shared-2027/build_packages.py'
      - 'resume/resume-profiles/faculty/Waseem_Raza_FACULTY_CS_AI_ML.pdf'
      - '.github/workflows/build-saint-peters-ds-adjunct.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: saint-peters-ds-adjunct-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document dependencies
        run: python -m pip install -r resume/requirements.txt
      - name: Generate verified Caldwell cover letter and shared CV copy
        run: python resume/job-applications/faculty/saint-peters-data-science-adjunct-2026/build_documents.py
      - name: Check exactly one cover letter and one reused CV
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from pypdf import PdfReader
          base=Path('resume/job-applications/faculty/saint-peters-data-science-adjunct-2026/submission-ready')
          common=Path('resume/resume-profiles/faculty/Waseem_Raza_FACULTY_CS_AI_ML.pdf')
          cv=base/'WRaza_SP_DS_ADJ26_CV.pdf'
          letter=base/'WRaza_SP_DS_ADJ26_Cover_Letter.pdf'
          docx=base/'WRaza_SP_DS_ADJ26_Cover_Letter.docx'
          assert all(p.is_file() for p in [cv,letter,docx])
          assert sha256(cv.read_bytes()).digest()==sha256(common.read_bytes()).digest(), 'CV differs from shared version'
          assert len(PdfReader(str(cv)).pages)==4, 'Shared CS CV should be four pages'
          assert len(PdfReader(str(letter)).pages)==1, 'Saint Peter's letter must be one page'
          assert len(list(base.glob('*.pdf')))==2, 'Only one shared CV and cover letter should be packaged'
          print('Saint Peter's adjunct: 4-page shared CS CV + 1-page cover letter + editable Word letter')
          PY
      - name: Publish three applicant documents to develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            resume/job-applications/faculty/saint-peters-data-science-adjunct-2026/submission-ready/WRaza_SP_DS_ADJ26_CV.pdf \
            resume/job-applications/faculty/saint-peters-data-science-adjunct-2026/submission-ready/WRaza_SP_DS_ADJ26_Cover_Letter.pdf \
            resume/job-applications/faculty/saint-peters-data-science-adjunct-2026/submission-ready/WRaza_SP_DS_ADJ26_Cover_Letter.docx
          if ! git diff --cached --quiet; then
            git commit -m "Publish Saint Peter's Data Science adjunct application documents"
            git reset --hard HEAD
            git pull --rebase origin develop
            git push origin HEAD:develop
          fi
