name: Deploy portfolio to GitHub Pages

# One GitHub Pages site serves both environments:
#   main    -> /portfolio/
#   develop -> /portfolio/develop/
#
# The develop deployment also builds the resume LaTeX sources and publishes
# browser-viewable PDFs under /portfolio/develop/resumes/.
on:
  push:
    branches: [main, develop]
    paths:
      - 'dist/**'
      - 'resume/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: ${{ github.ref_name == 'main' && 'github-pages' || 'github-pages-development' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: source-main

      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: develop
          path: source-develop

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: source-develop/resume/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install resume dependencies
        run: python -m pip install -r source-develop/resume/requirements.txt

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended lmodern

      - name: Validate resume sources
        working-directory: source-develop
        run: python -m unittest discover -s resume/tests

      - name: Generate develop resume PDFs
        working-directory: source-develop
        run: python resume/build.py --all

      - name: Generate tailored develop resumes
        working-directory: source-develop
        run: python resume/build_tailored.py --all

      - name: Audit faculty PDF line breaks and pagination
        working-directory: source-develop
        run: python resume/validate_pdf_layout.py

      - name: Assemble production, development, and resume previews
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site/develop/resumes/generic-resume _site/develop/resumes/job-applications

          # Production website.
          cp -a source-main/dist/. _site/

          # Development website.
          cp -a source-develop/dist/. _site/develop/

          # Reusable generic profile PDFs are kept separate from applications.
          cp -a source-develop/resume/generic-resume/. _site/develop/resumes/generic-resume/
          test "$(find _site/develop/resumes/generic-resume -type f -name '*.pdf' | wc -l)" -ge 10

          # Job-specific PDFs are stored directly inside their application folders.
          while IFS= read -r -d '' pdf; do
            relative="${pdf#source-develop/resume/}"
            destination="_site/develop/resumes/$relative"
            mkdir -p "$(dirname "$destination")"
            cp "$pdf" "$destination"
          done < <(find source-develop/resume/job-applications -type f -name '*.pdf' -print0)
          test "$(find _site/develop/resumes/job-applications -type f -name '*.pdf' | wc -l)" -ge 5

          # Browser index for the generated PDFs.
          {
            cat <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="robots" content="noindex,nofollow">
            <title>Develop Resume PDFs | Waseem Raza</title>
            <style>
              body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:960px;margin:48px auto;padding:0 24px;color:#17263a;background:#f6f8fb}
              h1{margin-bottom:6px} p{color:#5c6b7a}.grid{display:grid;gap:12px;margin-top:28px}
              a.card{display:flex;justify-content:space-between;gap:20px;padding:18px 20px;border:1px solid #d7e0ea;border-radius:12px;background:#fff;color:#1459c7;text-decoration:none}
              a.card:hover{border-color:#1459c7}.meta{font-size:13px;color:#687789}.back{display:inline-block;margin-bottom:20px}
            </style>
          </head>
          <body>
            <a class="back" href="../">← Develop portfolio</a>
            <h1>Develop Resume PDFs</h1>
            <p>Generated automatically from the current <code>develop</code> branch after tests and LaTeX compilation succeed.</p>
          HTML

            for group in faculty industry; do
              printf '    <h2 id="%s" style="margin-top:36px">Generic %s resumes</h2>\n    <div class="grid">\n' "$group" "${group^}"
              for pdf in "_site/develop/resumes/generic-resume/$group/"Waseem_Raza_*.pdf; do
                test -f "$pdf" || { echo "Missing generic PDF preview in $group" >&2; exit 1; }
                file="$(basename "$pdf")"
                label="${file#Waseem_Raza_}"
                label="${label%.pdf}"
                printf '      <a class="card" href="generic-resume/%s/%s" target="_blank"><strong>%s</strong><span class="meta">Open PDF ↗</span></a>\n' "$group" "$file" "$label"
              done
              printf '    </div>\n'
            done

            cat <<'HTML'
            <h2 style="margin-top:36px">Job-specific applications</h2>
            <div class="grid">
          HTML

            while IFS= read -r -d '' pdf; do
              rel="${pdf#_site/develop/resumes/}"
              label="$(basename "$pdf" .pdf)"
              printf '      <a class="card" href="%s" target="_blank"><strong>%s</strong><span class="meta">Open application PDF ↗</span></a>\n' "$rel" "$label"
            done < <(find _site/develop/resumes/job-applications -type f -name '*.pdf' -print0)

            cat <<'HTML'
            </div>
          </body>
          </html>
          HTML
          } > _site/develop/resumes/index.html

          # Prevent the non-production mirror from being indexed.
          while IFS= read -r -d '' file; do
            if grep -qi '</head>' "$file" && ! grep -qi 'name="robots"' "$file"; then
              sed -i '0,/<\/head>/s//  <meta name="robots" content="noindex,nofollow">\n<\/head>/' "$file"
            fi
          done < <(find _site/develop -type f -name '*.html' -print0)

          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload combined website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish environment links
        shell: bash
        run: |
          {
            echo "## Development previews"
            echo
            echo "- Production portfolio: https://waseemraza844.github.io/portfolio/"
            echo "- Develop portfolio: https://waseemraza844.github.io/portfolio/develop/"
            echo "- Browse ALL generic and job-specific resume PDFs: https://waseemraza844.github.io/portfolio/develop/resumes/"
            echo "- Faculty PDFs: https://waseemraza844.github.io/portfolio/develop/resumes/#faculty"
            echo "- Industry PDFs: https://waseemraza844.github.io/portfolio/develop/resumes/#industry"
            echo "- Infosys 154451BR tailored resume: https://waseemraza844.github.io/portfolio/develop/resumes/job-applications/industry/infosys-genai-engineer-154451BR/Waseem_Raza_INFOSYS_GENAI_154451BR.pdf"
          } >> "$GITHUB_STEP_SUMMARY"
